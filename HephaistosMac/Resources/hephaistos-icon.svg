<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <!-- Icône d'Héphaïstos, même famille qu'Argos, Hermès, Muse et Pactole : fond blanc → bleu pâle, trait bleu.
       Compteur en demi-cercle (zone chaude épaissie à droite) et petit afficheur « °C ».
       Rendu en PNG par scripts/make-hephaistos-icon.swift. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#DCE9FB"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4F8FF"/>
    <stop offset="1" stop-color="#D3E3FA"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#bg)"/>
  <g stroke="#3F74D9" stroke-linejoin="round" stroke-linecap="round" fill="none">
<path d="M24.02 75.00 A30 30 0 1 1 75.98 75.00 Z" fill="url(#fill)" stroke="none"/>
    <path d="M24.02 75.00 A30 30 0 1 1 75.98 75.00" stroke-width="3.6"/>
    <path d="M75.98 45.00 A30 30 0 0 1 75.98 75.00" stroke-width="8.4"/>
    <path d="M33.55 69.50 L29.65 71.75 M33.55 50.50 L29.65 48.25 M50.00 41.00 L50.00 36.50" stroke-width="3"/>
    <path d="M50 60 L68.07 54.13" stroke-width="4.2"/>
    <circle cx="50" cy="60" r="5" fill="#3F74D9" stroke="none"/>
    <rect x="39" y="69" width="22" height="11" rx="5.5" fill="#FFFFFF" stroke-width="2.6"/>
    <text x="50" y="77.6" text-anchor="middle" font-family="Helvetica-Bold, Helvetica" font-weight="bold" font-size="8" fill="#3F74D9" stroke="none">°C</text>
  </g>
</svg>
