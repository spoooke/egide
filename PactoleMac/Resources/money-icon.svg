<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <!-- Icône de Money, même famille qu'Argos, Hermès et Muse : fond blanc → bleu pâle, trait bleu.
       Rendu en PNG par scripts/make-money-icon.swift. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE9FB"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F8FF"/>
      <stop offset="1" stop-color="#D3E3FA"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#bg)"/>
  <g stroke="#3F74D9" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <!-- Portefeuille -->
    <path d="M22 33 L56 22 C59 21 62 23 62 26 L62 33" stroke-width="3.6"/>
    <rect x="19" y="32" width="62" height="44" rx="8" fill="url(#fill)" stroke-width="3.6"/>
    <!-- Languette avec bouton -->
    <path d="M81 46 L66 46 C62 46 59 49 59 53 L59 55 C59 59 62 62 66 62 L81 62" fill="#FFFFFF" stroke-width="3.6"/>
    <circle cx="67" cy="54" r="2.4" fill="#3F74D9" stroke="none"/>
  </g>
  <!-- La pièce qui s'échappe, translucide (comme le bit d'Argos et l'étincelle de Muse). -->
  <g transform="translate(75 21)" stroke="#3F74D9" stroke-linecap="round" fill="none" stroke-opacity="0.6">
    <circle r="9.5" fill="#FFFFFF" fill-opacity="0.75" stroke-width="3"/>
    <path d="M3.6 -4.2 C2.6 -5.4 1.2 -6 -0.4 -6 C-3.6 -6 -5.6 -3.4 -5.6 0 C-5.6 3.4 -3.6 6 -0.4 6 C1.2 6 2.6 5.4 3.6 4.2" stroke-width="2.4"/>
    <path d="M-8 -1.6 L1 -1.6 M-8 1.8 L1 1.8" stroke-width="2"/>
  </g>
</svg>
