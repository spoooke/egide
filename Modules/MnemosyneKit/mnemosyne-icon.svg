<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <!-- Mnémosyne icon, same family as the other tools: white to pale blue background, blue stroke.
       A clock turning back in time above an external drive. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#DCE9FB"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4F8FF"/>
    <stop offset="1" stop-color="#D3E3FA"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#E8F0FC"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#bg)"/>
  <g stroke="#3F74D9" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <circle cx="50" cy="37" r="19" fill="url(#fill)" stroke="none"/>
    <path d="M32.15 30.5 A19 19 0 1 0 43.5 19.15" stroke-width="3.6"/>
    <path d="M44.6 13.4 L40.7 20.2 L48 22.8" stroke-width="3.6"/>
    <path d="M50 37 V26.5 M50 37 L57.5 41.5" stroke-width="3"/>
    <circle cx="50" cy="37" r="2.6" fill="#3F74D9" stroke="none"/>
    <rect x="22" y="63" width="56" height="19" rx="4.5" fill="url(#page)" stroke-width="3.4"/>
    <path d="M30 72.5 H50" stroke-width="2.6"/>
    <circle cx="69" cy="72.5" r="2.4" fill="#3F74D9" stroke="none"/>
  </g>
</svg>
