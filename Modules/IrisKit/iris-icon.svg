<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <!-- Icône d'Iris, même famille qu'Argos, Hermès, Muse, Pactole, Héphaïstos et Cerbère : fond blanc → bleu pâle, trait bleu.
       Feuille traversée par la ligne du scan, devant l'arc-en-ciel d'Iris (la messagère).
       Copiée dans l'accueil d'Égide par scripts/make-module-icons.swift. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#DCE9FB"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4F8FF"/>
    <stop offset="1" stop-color="#D3E3FA"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#E8F0FC"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#bg)"/>
  <g stroke="#3F74D9" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <path d="M15 72 A35 35 0 0 1 85 72" stroke-width="3.6"/>
    <path d="M24 72 A26 26 0 0 1 76 72" stroke-width="3" stroke="#8EB0EC"/>
    <path d="M36 26 H56 L65 35 V82 H36 Z" fill="url(#page)" stroke-width="3.4"/>
    <path d="M56 26 V35 H65" stroke-width="2.6"/>
    <path d="M42 44 H58 M42 51 H58 M42 65 H58 M42 72 H52" stroke-width="2.6"/>
    <path d="M29 58 H72" stroke-width="3.6"/>
  </g>
</svg>
